<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kindling">
  <!--
    The Kindling mark: a four-pointed spark held inside a hexagon.

    Both shapes take the same ember gradient, so the mark is a single colour
    idea rather than a container plus a contrasting fill. It therefore needs no
    light/dark variant: the orange holds on white and on black alike, which is
    why there is no `prefers-color-scheme` block here.

    Geometry is parametric in the study that produced this file — hexagon
    circumradius 26, stroke 5.5, corners trimmed 6 and bridged with a quadratic
    through the original vertex, star 15 tall by 10.5 wide with a 0.22 waist.
    Nudge the numbers there rather than editing this path by hand.

    Keep in step with `KindlingMark` in src/client/chrome.tsx.
  -->
  <defs>
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="12" y1="56" x2="52" y2="8">
      <stop offset="0" stop-color="#FF6A00" />
      <stop offset="1" stop-color="#FFA32B" />
    </linearGradient>
  </defs>
  <path
    fill="none"
    stroke="url(#ember)"
    stroke-width="5.5"
    stroke-linejoin="round"
    d="M37.20 11.75Q32.00 8.75 26.80 11.75L17.06 17.38Q11.86 20.38 11.86 26.38L11.86 37.63Q11.86 43.63 17.06 46.63L26.80 52.25Q32.00 55.25 37.20 52.25L46.94 46.63Q52.14 43.63 52.14 37.63L52.14 26.38Q52.14 20.38 46.94 17.38Z"
  />
  <path
    fill="url(#ember)"
    d="M32 17Q34.31 28.7 42.5 32Q34.31 35.3 32 47Q29.69 35.3 21.5 32Q29.69 28.7 32 17Z"
  />
</svg>
